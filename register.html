<!DOCTYPE html>
<html lang="en">
<head>
<meta  charset="UTF-8">
<meta  name="viewport"  content="width=device-width,  initial-scale=1.0">
<title>Greenify - Register</title>
<link rel="stylesheet" href="style.css">
</head>
 
<body>
<header>
<nav class="navbar">
<a href="index.html" class="brand">Greenify</a>
<ul class="nav-links">
<li><a href="catalog.html">Catalog</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="login.html">Login</a></li>
</ul>
</nav>
</header>

<section  class="form-section">
<div  class="form-container">
<h2>Register for Greenify</h2>
<form  id="register-form">
<div  class="input-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter your username" required>
</div>
<div  class="input-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
</div>
<div  class="input-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
</div>
<button  type="submit"  class="submit-btn">Register</button>
<p class="redirect-link">Already have an account? <a href="login.html">Login here</a></p>
</form>
<script>
document.getElementById("register-form").addEventListener("submit",   function(event) {
event.preventDefault(); ndow.location.href = "login.html";
});

</script>
</div>
</section>
<footer class="footer">
<p>&copy; 2025 Greenify - All rights reserved.</p>
</footer>
</body>
</html>
