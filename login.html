<!DOCTYPE html>
<html lang="en">
<head>
<meta  charset="UTF-8">
<meta  name="viewport"  content="width=device-width,  initial-scale=1.0">
<title>Greenify - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<nav class="navbar">
<a href="index.html" class="brand">Greenify</a>
<ul class="nav-links">
 
<li><a href="catalog.html">Catalog</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="login.html">Login</a></li>
</ul>
</nav>
</header>

<section  class="form-section">
<div  class="form-container">
<h2>Welcome Back to Greenify</h2>
<form  id="login-form">
<div  class="input-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
</div>
<div  class="input-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
</div>
<button  type="submit"  class="submit-btn">Login</button>
<p class="redirect-link">Don't have an account? <a href="register.html">Register here</a></p>
</form>
<script>
document.getElementById("login-form").addEventListener("submit",   function(event) {
event.preventDefault();
window.location.href = "index.html"; 
});
</script>
</div>
</section>

<footer class="footer">
<p>&copy; 2025 Greenify - All rights reserved.</p>
</footer>
</body>
</html>
